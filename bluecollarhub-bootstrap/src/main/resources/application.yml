spring:
  application:
    name: bluecollarhub
  datasource:
    url: jdbc:postgresql://localhost:5433/bluecollarhub_db
    username: postgres
    password: password # Replace with your local Postgres password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates/updates DB tables based on our JPA Entities
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080